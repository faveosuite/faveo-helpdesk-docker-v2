<IfModule !headers_module>
    LoadModule headers_module modules/mod_headers.so
</IfModule>

FileETag None
ServerTokens prod
ServerSignature off
TraceEnable off
Protocols http/1.1 h2

<VirtualHost *:80>
ServerName example.com
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/faveo-error.log
    CustomLog ${APACHE_LOG_DIR}/faveo-access.log combined
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =domainrewrite
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
ServerName example.com
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/faveo-error.log
    CustomLog ${APACHE_LOG_DIR}/faveo-access.log combined
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/faveolocal.crt
    SSLCertificateKeyFile /etc/ssl/private/private.key
    SSLCertificateChainFile /usr/local/share/ca-certificates/faveorootCA.crt

#    ProxyPreserveHost On
#    ProxyPass "/natsws" "ws://faveo-nats:9235/"
#    ProxyPassReverse "/natsws" "ws://faveo-nats:9235/"
#    Header always set X-Forwarded-Proto https

#   ProxyPreserveHost On
#   SSLProxyEngine On

#   ProxyPass /fc/ http://faveo-supervisor:6001/fc/ retry=0
#   ProxyPassReverse /fc/ http://faveo-supervisor:6001/fc/

#   RewriteEngine On
#   RewriteCond %{HTTP:Upgrade} websocket [NC]
#   RewriteCond %{HTTP:Connection} upgrade [NC]
#   RewriteRule ^/fc/(.*) ws://faveo-supervisor:6001/fc/$1 [P,L]

</VirtualHost>
</IfModule>

<IfModule mod_headers.c>
    Header always unset X-Frame-Options
    Header always unset X-Content-Type-Options

    Header set Content-Security-Policy "frame-ancestors 'self'"
    Header set Referrer-Policy "no-referrer-when-downgrade"
    Header set X-Content-Type-Options "nosniff"
    Header set X-Frame-Options "SAMEORIGIN"
    Header set X-XSS-Protection "1; mode=block"
    Header set Permissions-Policy "geolocation=(self), microphone=()"
    Header set Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Header set Expect-CT "max-age=86400, enforce"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
</IfModule>

